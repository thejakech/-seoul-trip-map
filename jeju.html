<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeju Trip Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="seaBackground" aria-hidden="true"></div>

  <div id="map">
    <div id="jejuStage">
      <img id="jejuImg" src="assets/jeju/jeju-bg.png" width="1342" height="1172" alt="Illustrated map of Jeju Island">
      <div id="jejuPins"></div>
    </div>
  </div>

  <nav class="regiontabs" aria-label="Choose a region">
    <a href="index.html">Seoul</a>
    <a href="jeju.html" class="on">Jeju</a>
    <a href="busan.html">Busan</a>
  </nav>

  <header class="hud" id="hud">
    <div class="card" id="hudCard">
      <button id="hudClose" class="hud-close" aria-label="Collapse">&times;</button>
      <div class="brand">
        <h1>Jeju <span>Island</span></h1>
        <p class="sub">Jake + sister · Oct 2026</p>
      </div>
      <div class="hud-row">
        <div class="progress" title="Places checked off">
          <div class="progress-bar"><span id="progressFill"></span></div>
          <span id="progressCount">0 / 0</span>
        </div>
        <button id="btnList" class="txtbtn">List view</button>
      </div>
    </div>
    <div class="catbar" id="catbar"></div>
  </header>
  <button id="hudReopen" class="hud-reopen" hidden>Jeju <span>▾</span></button>

  <aside id="panel" class="panel" aria-live="polite">
    <div class="grab"></div>
    <button id="panelClose" class="panel-close" aria-label="Close">&times;</button>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <script src="jeju.js"></script>
</body>
</html>
